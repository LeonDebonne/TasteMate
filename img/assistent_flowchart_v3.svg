<svg width="100%" viewBox="0 0 680 994" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Flowchart voice-assistent v3</title>
  <desc>Stroomdiagram van de spraakgestuurde koelkastassistent met knopbediening</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Start -->
  <g>
    <rect x="230" y="30" width="220" height="56" rx="28" stroke-width="0.5" style="fill:rgb(68,68,65);stroke:rgb(180,178,169);"/>
    <text x="340" y="50" text-anchor="middle" dominant-baseline="central" style="fill:rgb(211,209,199);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Assistent opstarten</text>
    <text x="340" y="70" text-anchor="middle" dominant-baseline="central" style="fill:rgb(156,154,146);font-family:system-ui,sans-serif;font-size:12px;">GPIO, pygame, microfoon kalibreren</text>
  </g>

  <!-- Pijl 1 -->
  <line x1="340" y1="86" x2="340" y2="114" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

  <!-- Wachten op knop -->
  <g>
    <rect x="210" y="114" width="260" height="56" rx="8" stroke-width="0.5" style="fill:rgb(12,68,124);stroke:rgb(133,183,235);"/>
    <text x="340" y="134" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181,212,244);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Wachten op knopdruk</text>
    <text x="340" y="154" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,183,235);font-family:system-ui,sans-serif;font-size:12px;">button.wait_for_press() op GPIO17</text>
  </g>

  <!-- Pijl 2 -->
  <line x1="340" y1="170" x2="340" y2="210" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

  <!-- Audio opnemen -->
  <g>
    <rect x="210" y="210" width="260" height="56" rx="8" stroke-width="0.5" style="fill:rgb(12,68,124);stroke:rgb(133,183,235);"/>
    <text x="340" y="230" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181,212,244);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Audio opnemen</text>
    <text x="340" y="250" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,183,235);font-family:system-ui,sans-serif;font-size:12px;">Max 10s — USB microfoon</text>
  </g>

  <!-- Pijl 3 -->
  <line x1="340" y1="266" x2="340" y2="306" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

  <!-- Spraak verstaan? -->
  <g>
    <path d="M340,306 L470,366 L340,426 L210,366 Z" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px;"/>
    <text x="340" y="358" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159,225,203);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Spraak</text>
    <text x="340" y="376" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159,225,203);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">verstaan?</text>
  </g>

  <!-- NEE links — niet verstaan -->
  <line x1="210" y1="366" x2="140" y2="366" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>
  <text x="170" y="354" text-anchor="middle" style="fill:rgb(194,192,182);font-family:system-ui,sans-serif;font-size:12px;">NEE</text>
  <path d="M140 366 L140 142 L210 142" fill="none" stroke="rgba(222,220,209,0.4)" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="76" y="256" text-anchor="end" style="fill:rgb(194,192,182);font-family:system-ui,sans-serif;font-size:12px;">Opnieuw</text>
  <text x="76" y="272" text-anchor="end" style="fill:rgb(194,192,182);font-family:system-ui,sans-serif;font-size:12px;">proberen</text>

  <!-- FOUT rechts — request error -->
  <line x1="470" y1="366" x2="540" y2="366" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>
  <text x="500" y="354" text-anchor="middle" style="fill:rgb(194,192,182);font-family:system-ui,sans-serif;font-size:12px;">FOUT</text>
  <g>
    <rect x="540" y="344" width="110" height="44" rx="8" stroke-width="0.5" style="fill:rgb(113,43,19);stroke:rgb(240,153,123);"/>
    <text x="595" y="360" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245,196,179);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Geen verbinding</text>
    <text x="595" y="376" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240,153,123);font-family:system-ui,sans-serif;font-size:12px;">RequestError</text>
  </g>
  <path d="M595 388 L595 912 L450 912" fill="none" stroke="rgba(222,220,209,0.4)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- JA pijl naar beneden -->
  <text x="295" y="441" text-anchor="middle" style="fill:rgb(194,192,182);font-family:system-ui,sans-serif;font-size:12px;">JA</text>
  <line x1="340" y1="426" x2="340" y2="466" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

  <!-- Inventory laden -->
  <g>
    <rect x="210" y="466" width="260" height="56" rx="8" stroke-width="0.5" style="fill:rgb(12,68,124);stroke:rgb(133,183,235);"/>
    <text x="340" y="486" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181,212,244);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Inventory inlezen</text>
    <text x="340" y="506" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,183,235);font-family:system-ui,sans-serif;font-size:12px;">Actuele JSON ophalen</text>
  </g>

  <!-- Inventory niet gevonden — fout rechts -->
  <line x1="470" y1="494" x2="540" y2="494" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>
  <text x="500" y="482" text-anchor="middle" style="fill:rgb(194,192,182);font-family:system-ui,sans-serif;font-size:12px;">FOUT</text>
  <g>
    <rect x="540" y="472" width="110" height="44" rx="8" stroke-width="0.5" style="fill:rgb(113,43,19);stroke:rgb(240,153,123);"/>
    <text x="595" y="488" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245,196,179);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Niet gevonden</text>
    <text x="595" y="504" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240,153,123);font-family:system-ui,sans-serif;font-size:12px;">FileNotFoundError</text>
  </g>
  <path d="M595 516 L595 912" fill="none" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>

  <!-- Pijl 5 -->
  <line x1="340" y1="522" x2="340" y2="562" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

  <!-- Gemini AI -->
  <g>
    <rect x="210" y="562" width="260" height="56" rx="8" stroke-width="0.5" style="fill:rgb(60,52,137);stroke:rgb(175,169,236);"/>
    <text x="340" y="582" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206,203,246);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Vraag naar Gemini AI</text>
    <text x="340" y="602" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175,169,236);font-family:system-ui,sans-serif;font-size:12px;">Antwoord genereren</text>
  </g>

  <!-- Gemini fout rechts -->
  <line x1="470" y1="590" x2="540" y2="590" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>
  <text x="500" y="578" text-anchor="middle" style="fill:rgb(194,192,182);font-family:system-ui,sans-serif;font-size:12px;">FOUT</text>
  <g>
    <rect x="540" y="568" width="110" height="44" rx="8" stroke-width="0.5" style="fill:rgb(113,43,19);stroke:rgb(240,153,123);"/>
    <text x="595" y="584" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245,196,179);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Gemini fout</text>
    <text x="595" y="600" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240,153,123);font-family:system-ui,sans-serif;font-size:12px;">Overbelast</text>
  </g>
  <path d="M595 612 L595 912" fill="none" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>

  <!-- Pijl 6 -->
  <line x1="340" y1="618" x2="340" y2="658" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

  <!-- Antwoord uitspreken -->
  <g>
    <rect x="210" y="658" width="260" height="56" rx="8" stroke-width="0.5" style="fill:rgb(12,68,124);stroke:rgb(133,183,235);"/>
    <text x="340" y="678" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181,212,244);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Antwoord uitspreken</text>
    <text x="340" y="698" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,183,235);font-family:system-ui,sans-serif;font-size:12px;">Edge TTS + pygame</text>
  </g>

  <!-- Lus terug naar wachten op knop (links) -->
  <path d="M210 686 L80 686 L80 142 L210 142" fill="none" stroke="rgba(222,220,209,0.4)" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="76" y="366" text-anchor="end" style="fill:rgb(194,192,182);font-family:system-ui,sans-serif;font-size:12px;">Volgende</text>
  <text x="76" y="382" text-anchor="end" style="fill:rgb(194,192,182);font-family:system-ui,sans-serif;font-size:12px;">vraag</text>

  <!-- Pijl 7 -->
  <line x1="340" y1="714" x2="340" y2="754" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

  <!-- Ctrl+C -->
  <g>
    <rect x="210" y="754" width="260" height="44" rx="8" stroke-width="0.5" style="fill:rgb(113,43,19);stroke:rgb(240,153,123);"/>
    <text x="340" y="770" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245,196,179);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Ctrl+C ingedrukt</text>
    <text x="340" y="788" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240,153,123);font-family:system-ui,sans-serif;font-size:12px;">KeyboardInterrupt</text>
  </g>

  <!-- Pijl 8 -->
  <line x1="340" y1="798" x2="340" y2="838" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

  <!-- Opruimen -->
  <g>
    <rect x="210" y="838" width="260" height="56" rx="8" stroke-width="0.5" style="fill:rgb(12,68,124);stroke:rgb(133,183,235);"/>
    <text x="340" y="858" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181,212,244);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Audio opruimen</text>
    <text x="340" y="878" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,183,235);font-family:system-ui,sans-serif;font-size:12px;">pygame.mixer stoppen</text>
  </g>

  <!-- Fout-pijlen samenkomen bij opruimen -->
  <line x1="595" y1="912" x2="470" y2="912" marker-end="url(#arrow)" style="fill:none;stroke:rgba(222,220,209,0.4);stroke-width:1px;"/>

  <!-- Pijl 9 -->
  <line x1="340" y1="894" x2="340" y2="926" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px;"/>

  <!-- Einde -->
  <g>
    <rect x="230" y="926" width="220" height="44" rx="22" stroke-width="0.5" style="fill:rgb(68,68,65);stroke:rgb(180,178,169);"/>
    <text x="340" y="948" text-anchor="middle" dominant-baseline="central" style="fill:rgb(211,209,199);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Assistent sluit af</text>
  </g>

</svg>
